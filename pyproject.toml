[project]
name = "braille-reader"
version = "0.1.0"
description = "Thai Braille recognition with YOLO cell streaming and synthetic training data"
readme = "README.md"
authors = [
    { name = "Bobangely" }
]
requires-python = ">=3.12"
dependencies = [
    "gtts>=2.5.4",
    "mediapipe==1.1.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyttsx3>=2.99",
    "ultralytics>=8.4,<9",
    "pyyaml>=6.0",
    "pythainlp==5.3.3",
    "python-docx>=1.1",
]

[tool.uv]
package = false
