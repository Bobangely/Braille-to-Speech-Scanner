<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braille Station</title>
<!-- Teacher panel. API contract: docs/web-api.md. Opened from file:// or with ?demo it runs on fake data. -->
<style>
  :root {
    --blue: #0050dc; --blue-soft: #dbe7ff; --bg: #f6f7f9; --card: #fff; --line: #e1e5eb;
    --text: #1d2430; --muted: #5b6472; --ok-bg: #dcfce7; --ok: #166534; --bad-bg: #fee2e2; --bad: #991b1b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
           padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--ok-bg); color: var(--ok); }
  .chip.off { background: var(--bad-bg); color: var(--bad); }
  .chip.plain { background: #eef1f5; color: var(--muted); }
  #offline { display: none; padding: 8px 16px; background: var(--bad); color: #fff; font-weight: 600; }
  #offline.show { display: block; }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .cam { position: relative; padding: 0; overflow: hidden; background: #2a2f38; min-height: 240px;
         display: flex; align-items: center; justify-content: center; }
  .cam img { display: block; width: 100%; height: auto; }
  .cam .placeholder { color: #c3c9d2; }
  .cam .toggle { position: absolute; top: 10px; right: 10px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .symbol { font-size: 40px; font-weight: 800; color: var(--blue); line-height: 1.2; min-height: 48px; }
  .word { font-size: 18px; }
  .seg { display: flex; border: 1px solid #cfd6df; border-radius: 8px; overflow: hidden; margin: 4px 0 12px; }
  button { font: inherit; cursor: pointer; }
  .seg button { flex: 1; padding: 8px 0; border: 0; background: var(--card); color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper.dim { opacity: .45; }
  .stepper button, .toggle { min-width: 40px; padding: 6px 12px; border: 1px solid #cfd6df; border-radius: 8px; background: var(--card); color: var(--text); }
  .toggle[aria-pressed="true"] { background: #16a34a; border-color: #16a34a; color: #fff; }
  .stepper output { min-width: 1.5em; text-align: center; font-size: 20px; font-weight: 700; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #error { color: var(--bad); font-size: 14px; min-height: 1.4em; margin: 8px 0 0; }
  .page { grid-column: 1 / -1; }
  #lines p { margin: 4px 0; font-size: 20px; }
  .page span { padding: 0 4px; border-radius: 4px; }
  .page span.active { background: var(--blue-soft); color: var(--blue); font-weight: 700; }
  .muted { color: var(--muted); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; padding: 12px; } }
</style>
</head>
<body>
<header>
  <h1>BRAILLE STATION</h1>
  <div class="chips" aria-live="polite">
    <span class="chip" id="chip-markers">marker</span>
    <span class="chip" id="chip-hand">มือ</span>
    <span class="chip plain" id="chip-status">—</span>
    <span class="chip plain" id="chip-fps">— fps</span>
  </div>
</header>
<div id="offline" role="alert">ขาดการเชื่อมต่อกับสถานี กำลังลองใหม่…</div>

<main>
  <section class="card cam" aria-label="ภาพกล้อง">
    <img id="stream" alt="ภาพจากกล้องพร้อมโครงมือและกรอบเซลล์" hidden>
    <span class="placeholder" id="cam-note">ภาพกล้องปิดอยู่</span>
    <button class="toggle" id="camera" aria-pressed="true" aria-label="เปิดหรือปิดภาพกล้อง">กล้อง: เปิด</button>
  </section>

  <aside>
    <section class="card" aria-live="polite">
      <p class="label">ใต้นิ้ว</p>
      <div class="symbol" id="symbol">—</div>
      <div class="word">คำ: <b id="word">—</b></div>
      <div class="muted">พูดล่าสุด: <span id="spoken">—</span></div>
    </section>

    <section class="card">
      <p class="label">โหมดเสียง</p>
      <div class="seg" role="group" aria-label="โหมดเสียง">
        <button id="mode-spell" aria-pressed="true">สะกด</button>
        <button id="mode-word" aria-pressed="false">เฉพาะคำ</button>
      </div>
      <div class="stepper" id="stepper">
        <span>สะกดคำยาวไม่เกิน</span>
        <button id="less" aria-label="ลดจำนวนเซลล์">−</button>
        <output id="cells" aria-live="polite">2</output>
        <button id="more" aria-label="เพิ่มจำนวนเซลล์">+</button>
        <span>เซลล์</span>
      </div>
      <p id="error" role="status"></p>
    </section>
  </aside>

  <section class="card page">
    <p class="label">ข้อความทั้งหน้า</p>
    <div id="lines"><p class="muted">รอหน้าหนังสือ</p></div>
  </section>
</main>

<script>
const DEMO = location.protocol === 'file:' || new URLSearchParams(location.search).has('demo');
const STATUS = {waiting_page: 'รอหน้าหนังสือ', learning: 'กำลังจำหน้า', reading: 'กำลังอ่าน'};
const $ = id => document.getElementById(id);
let settings = {mode: 'spell', spell_max_cells: 2, camera: true};
let sending = false;  // while a settings change is in flight, polls do not overwrite the buttons

// ---- fake station for DEMO ------------------------------------------------
const demo = (() => {
  const lines = [[['ช้าง', ['ชอช้าง', 'สระอา', 'ไม้โท', 'งองู']], ['กิน', ['กอไก่', 'สระอิ', 'นอหนู']],
                  ['กล้วย', ['กอไก่', 'ลอลิง', 'ไม้โท', 'วอแหวน', 'ยอยักษ์']]],
                 [['แมว', ['สระแอ', 'มอม้า', 'วอแหวน']], ['ก', ['กอไก่']], ['นอน', ['นอหนู', 'อออ่าง', 'นอหนู']]]];
  const words = lines.flat();
  const cells = words.flatMap((w, i) => w[1].map(name => [i, name]));
  let step = 0, spoken = null;
  return {
    state() {
      const [index, symbol] = cells[step % cells.length];
      const next = cells[(step + 1) % cells.length][0];
      const word = words[index];
      if (settings.mode === 'spell' || word[1].length <= settings.spell_max_cells) spoken = symbol;
      if (next !== index) spoken = word[1].length === 1 ? spoken : word[0];
      let n = 0;
      return {status: 'reading', markers: true, hand: true, fps: 24.6, symbol, word: word[0], active_word: index,
              last_spoken: spoken, settings,
              lines: lines.map(line => line.map(w => ({index: n++, text: w[0]})))};
    },
    tick() { step++; },
  };
})();
if (DEMO) setInterval(demo.tick, 800);

// ---- talking to the station ----------------------------------------------
async function getState() {
  if (DEMO) return demo.state();
  const r = await fetch('/api/state', {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function postSettings(partial) {
  if (DEMO) return {...settings, ...partial};
  const r = await fetch('/api/settings', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify(partial)});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `ตั้งค่าไม่สำเร็จ (${r.status})`);
  return body;
}

async function change(partial) {
  const before = settings;
  settings = {...settings, ...partial};
  sending = true;
  showSettings();
  $('error').textContent = '';
  try {
    settings = await postSettings(partial);
  } catch (e) {
    settings = before;
    $('error').textContent = e.message === 'Failed to fetch' ? 'ส่งค่าตั้งไม่ได้: ขาดการเชื่อมต่อ' : e.message;
  }
  sending = false;
  showSettings();
}

// ---- drawing ---------------------------------------------------------------
function chip(id, ok, text) {
  const el = $(id);
  el.textContent = text;
  el.classList.toggle('off', !ok);
}

function showSettings() {
  const spell = settings.mode === 'spell';
  $('mode-spell').setAttribute('aria-pressed', spell);
  $('mode-word').setAttribute('aria-pressed', !spell);
  $('cells').textContent = settings.spell_max_cells;
  $('stepper').classList.toggle('dim', spell);
  $('less').disabled = settings.spell_max_cells <= 1;
  $('more').disabled = settings.spell_max_cells >= 5;
  const cam = $('camera');
  cam.setAttribute('aria-pressed', settings.camera);
  cam.textContent = settings.camera ? 'กล้อง: เปิด' : 'กล้อง: ปิด';
  const img = $('stream');
  const live = settings.camera && !DEMO;
  if (live && img.hidden) img.src = '/stream.mjpg?' + Date.now();
  if (!live && !img.hidden) img.removeAttribute('src');  // closes the stream so the station stops encoding
  img.hidden = !live;
  $('cam-note').hidden = live;
  $('cam-note').textContent = !settings.camera ? 'ภาพกล้องปิดอยู่' : 'ภาพกล้อง (จำลอง)';
}

let shownLines = '';
function render(s) {
  chip('chip-markers', s.markers, s.markers ? 'marker ✓' : 'ไม่เห็น marker');
  chip('chip-hand', s.hand, s.hand ? 'มือ ✓' : 'ไม่เห็นมือ');
  $('chip-status').textContent = STATUS[s.status] || s.status;
  $('chip-fps').textContent = `${Number(s.fps || 0).toFixed(1)} fps`;
  $('symbol').textContent = s.symbol || '—';
  $('word').textContent = s.word || '—';
  $('spoken').textContent = s.last_spoken || '—';
  const key = JSON.stringify(s.lines);
  if (key !== shownLines) {  // rebuild only when the page changes
    shownLines = key;
    const box = $('lines');
    box.replaceChildren();
    if (!s.lines.length) box.innerHTML = '<p class="muted">รอหน้าหนังสือ</p>';
    for (const line of s.lines) {
      const p = document.createElement('p');
      for (const w of line) {
        const span = document.createElement('span');
        span.textContent = w.text;
        span.dataset.index = w.index;
        p.append(span, ' ');
      }
      box.append(p);
    }
  }
  for (const span of $('lines').querySelectorAll('span')) {
    span.classList.toggle('active', Number(span.dataset.index) === s.active_word);
  }
  if (!sending && JSON.stringify(s.settings) !== JSON.stringify(settings)) {
    settings = s.settings;
    showSettings();
  }
}

async function poll() {
  try {
    render(await getState());
    $('offline').classList.remove('show');
  } catch {
    $('offline').classList.add('show');
  }
  setTimeout(poll, 300);  // not setInterval: a slow reply never stacks requests
}

$('mode-spell').onclick = () => change({mode: 'spell'});
$('mode-word').onclick = () => change({mode: 'word'});
$('less').onclick = () => change({spell_max_cells: Math.max(1, settings.spell_max_cells - 1)});
$('more').onclick = () => change({spell_max_cells: Math.min(5, settings.spell_max_cells + 1)});
$('camera').onclick = () => change({camera: !settings.camera});
showSettings();
poll();
</script>
</body>
</html>
